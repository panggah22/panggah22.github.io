name: Update Scopus Citations

on:
  schedule:
    - cron: "0 0 * * 0"  # Every Sunday at midnight UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Scopus citation data
        env:
          ELSEVIER_SCOPUS_API_KEY: ${{ secrets.ELSEVIER_SCOPUS_API_KEY }}
          AL_FOLIO_ROOT: ${{ github.workspace }}
        run: python bin/fetch_scopus_citations.py

      - name: Commit updated citations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/scopus_citations.yml
          git diff --staged --quiet || git commit -m "chore: update Scopus citation data [skip ci]"
          git push
